<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA & CGPA Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
    +
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="splash" id="splash" hidden>
        <div class="sky" id="sky" aria-hidden="true">
            <div class="plane">
                <span class="trail"></span>
                <svg viewBox="0 0 64 64">
                    <polygon points="4,28 60,4 28,36" fill="currentColor" />
                    <polygon points="28,36 60,4 36,60" fill="currentColor" opacity=".6" />
                </svg>
            </div>
            <svg class="cap" viewBox="0 0 64 64">
                <polygon points="32,10 62,24 32,38 2,24" fill="currentColor" />
                <path d="M14 33v11c0 4 8 8 18 8s18-4 18-8V33l-18 9z" fill="currentColor" opacity=".6" />
                <path d="M58 27v16" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            </svg>
        </div>
        <div class="splash-content">
            <div class="eyebrow">University GPA toolkit</div>
            <h2 class="splash-title">
                <span style="--i:0">Track</span> <span style="--i:1">every</span> <span style="--i:2">grade.</span><br>
                <span class="accent" style="--i:3">Reach</span> <span class="accent" style="--i:4">every</span> <span
                    class="accent" style="--i:5">goal.</span>
            </h2>
            <p class="splash-sub">Calculate your GPA and CGPA, see which courses you validated, and aim for your target.
            </p>
            <button class="start-btn" id="start-btn" type="button">Get started <span
                    aria-hidden="true">→</span></button>
            <p class="splash-note">Takes about 20 seconds to set up.</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
